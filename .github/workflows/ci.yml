name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monstera_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monstera_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/monstera_ci
      NEXTAUTH_SECRET: ci-nextauth-secret-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CRON_SECRET: ci-cron-secret-at-least-32-characters
      GOOGLE_ID_TOKEN_AUDIENCES: ci-google-client-id.apps.googleusercontent.com
      PILOT_MODE: "1"
      CLIENT_ASSIGNMENT_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate and apply migrations
        run: |
          npx prisma validate
          npm run db:migrate:prepare
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run typecheck
      - run: npm run lint:ci
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Full browser QA journeys (isolated e2e database)
        run: |
          # Desktop and mobile projects run SEQUENTIALLY, each against a fully
          # reset, freshly migrated and reseeded isolated E2E database. The
          # seed runs inside Playwright's globalSetup (established path) after
          # migrations, per invocation. Concurrent projects shared and mutated
          # the same seeded state, cascading 401 CredentialsSignin failures.
          reset_e2e_db () {
            PGPASSWORD=postgres psql -h localhost -U postgres -c 'DROP DATABASE IF EXISTS monstera_e2e' -c 'CREATE DATABASE monstera_e2e'
            npx prisma migrate deploy
          }
          reset_e2e_db
          npx playwright test --project=desktop-chromium
          reset_e2e_db
          npx playwright test --project=mobile-chromium
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monstera_e2e
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/monstera_e2e
          CLIENT_ASSIGNMENT_TEST_DB: "1"
          # The application records the actually tested commit in report
          # snapshots (generator_commit_sha). Playwright's webServer inherits
          # the step environment, so the real GitHub SHA reaches next start.
          GIT_COMMIT_SHA: ${{ github.sha }}
      - run: npm audit --omit=dev --audit-level=high
