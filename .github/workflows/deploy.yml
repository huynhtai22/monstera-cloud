name: Deploy to Vercel

on:
  push:
    branches:
      - main                  # production deploy
  # Preview deploys are handled by Vercel's GitHub Integration.
  # This workflow intentionally only runs the Vercel CLI deploy on `main` to avoid
  # free-tier upload rate limits (`api-upload-free`) when many PR updates happen.

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
