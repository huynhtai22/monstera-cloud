name: Deploy to Vercel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Preview deploys are handled by Vercel's GitHub Integration.
  # This workflow intentionally only runs the Vercel CLI deploy on `main` to avoid
  # free-tier upload rate limits (`api-upload-free`) when many PR updates happen.

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Apply database migrations
        run: |
          set -a
          source .vercel/.env.production.local
          set +a
          test -n "$DATABASE_URL"
          npm ci
          npm run db:migrate:prepare

      - name: Build project
        env:
          GIT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Verify deployed version
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --output version.json \
              "https://monsteracloud.com/api/version" && \
              node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("version.json", "utf8")); if (v.commitSha !== process.env.EXPECTED_SHA) { console.error(`Expected ${process.env.EXPECTED_SHA}, got ${v.commitSha}`); process.exit(1) } if (!v.buildTime) { console.error("Missing build time"); process.exit(1) } if (v.schemaVersion !== "20260813090000_agency_pilot_tenancy") process.exit(1)'; then
              exit 0
            fi
            echo "Production alias is not ready yet (attempt $attempt/12)"
            sleep 5
          done
          exit 1
