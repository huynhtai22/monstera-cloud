name: Restore Google Ads demo data

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: Exact target workspace ID. Required to avoid ambiguous display names.
        required: true
        type: string
      workspace_name:
        description: Expected target workspace display name; checked against the supplied ID.
        required: true
        default: Personal Workspace
        type: string
      confirmation:
        description: Type RESTORE_GOOGLE_DEMO to replace only the dedicated demo Google rows.
        required: true
        type: string

jobs:
  restore:
    if: ${{ inputs.confirmation == 'RESTORE_GOOGLE_DEMO' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Restore dedicated Google demo rows
        env:
          RESTORE_WORKSPACE_NAME: ${{ inputs.workspace_name }}
          RESTORE_WORKSPACE_ID: ${{ inputs.workspace_id }}
          RESTORE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -a
          source .vercel/.env.production.local
          set +a
          npm run restore-personal-google-demo -- \
            --workspace-id "$RESTORE_WORKSPACE_ID" \
            --workspace-name "$RESTORE_WORKSPACE_NAME" \
            --confirm "$RESTORE_CONFIRMATION"
