name: Pilot cron

# Hobby Vercel cron is daily. This curl-only worker is the budget substitute
# for minute-level Pro cron: reclaim warehouse jobs, refresh tokens, and
# mark stale health about every 15 minutes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Hit warehouse jobs, token prefetch, Shopee refresh, health tick
        env:
          CRON_SECRET_WAREHOUSE_JOBS: ${{ secrets.CRON_SECRET_WAREHOUSE_JOBS || secrets.CRON_SECRET }}
          CRON_SECRET_TOKEN_PREFETCH: ${{ secrets.CRON_SECRET_TOKEN_PREFETCH || secrets.CRON_SECRET }}
          CRON_SECRET_SHOPEE_REFRESH: ${{ secrets.CRON_SECRET_SHOPEE_REFRESH || secrets.CRON_SECRET }}
          CRON_SECRET_HEALTH_TICK: ${{ secrets.CRON_SECRET_HEALTH_TICK || secrets.CRON_SECRET }}
          CRON_SECRET_CONNECTOR_ARTIFACTS_CLEANUP: ${{ secrets.CRON_SECRET_CONNECTOR_ARTIFACTS_CLEANUP || secrets.CRON_SECRET }}
          CRON_SECRET_REPORT_SCHEDULES: ${{ secrets.CRON_SECRET_REPORT_SCHEDULES || secrets.CRON_SECRET }}
          CRON_SECRET_SEAT_SHARING_RETENTION: ${{ secrets.CRON_SECRET_SEAT_SHARING_RETENTION || secrets.CRON_SECRET }}
          CRON_SECRET_SECURITY_POSTURE: ${{ secrets.CRON_SECRET_SECURITY_POSTURE || secrets.CRON_SECRET }}
          CRON_BASE_URL: ${{ vars.CRON_BASE_URL }}
        run: |
          set -euo pipefail
          BASE="${CRON_BASE_URL:-https://monsteracloud.com}"
          BASE="${BASE%/}"
          fail=0
          invoke() {
            path="$1"
            secret="$2"
            echo "::group::${path}"
            if [ -z "${secret:-}" ]; then
              echo "::error::Missing scoped and legacy GitHub Actions secret for ${path}"
              echo "::endgroup::"
              fail=1
              return
            fi
            code=$(curl -sS -o /tmp/cron-body -w "%{http_code}" \
              -H "Authorization: Bearer ${secret}" \
              --max-time 110 \
              "${BASE}${path}" || echo "000")
            echo "HTTP ${code}"
            head -c 2000 /tmp/cron-body || true
            echo
            echo "::endgroup::"
            if [ "${code}" != "200" ]; then
              fail=1
            fi
          }
          invoke /api/cron/warehouse-jobs "${CRON_SECRET_WAREHOUSE_JOBS:-}"
          invoke /api/cron/connections/token-prefetch "${CRON_SECRET_TOKEN_PREFETCH:-}"
          invoke /api/cron/shopee/refresh "${CRON_SECRET_SHOPEE_REFRESH:-}"
          invoke /api/cron/health-tick "${CRON_SECRET_HEALTH_TICK:-}"
          invoke /api/cron/connector-artifacts-cleanup "${CRON_SECRET_CONNECTOR_ARTIFACTS_CLEANUP:-}"
          invoke /api/cron/report-schedules "${CRON_SECRET_REPORT_SCHEDULES:-}"
          invoke /api/cron/seat-sharing-retention "${CRON_SECRET_SEAT_SHARING_RETENTION:-}"
          invoke /api/cron/security-posture "${CRON_SECRET_SECURITY_POSTURE:-}"
          exit "${fail}"
