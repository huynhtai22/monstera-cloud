<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Google Sans', -apple-system, sans-serif; font-size: 13px; color: #1f2937; padding: 16px; background: #fff; }
    h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #6b7280; font-size: 11px; margin-bottom: 16px; }

    /* States */
    .loading { text-align: center; padding: 40px 0; color: #6b7280; }
    .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #e5e7eb; border-top-color: #10b981; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 8px; padding: 10px 12px; font-size: 12px; margin-bottom: 12px; }
    .success-box { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; border-radius: 8px; padding: 10px 12px; font-size: 12px; margin-bottom: 12px; }
    .upgrade-box { background: #fefce8; border: 1px solid #fde68a; border-radius: 10px; padding: 16px; text-align: center; margin-bottom: 16px; }
    .upgrade-box a { display: inline-block; margin-top: 8px; padding: 8px 20px; background: #111827; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; }

    /* User pill */
    .user-pill { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 16px; }
    .user-pill img { width: 28px; height: 28px; border-radius: 50%; }
    .user-pill .name { font-weight: 600; font-size: 13px; }
    .user-pill .plan { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
    .plan-free { background: #f3f4f6; color: #6b7280; }
    .plan-starter { background: #dbeafe; color: #1d4ed8; }
    .plan-professional { background: #ede9fe; color: #7c3aed; }

    /* Form */
    label { display: block; font-size: 11px; font-weight: 600; color: #374151; margin-bottom: 4px; margin-top: 12px; text-transform: uppercase; letter-spacing: 0.3px; }
    select, input[type="date"], input[type="text"] {
      width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; color: #1f2937; background: #fff;
      outline: none; transition: border-color 0.15s;
    }
    select:focus, input:focus { border-color: #10b981; box-shadow: 0 0 0 2px rgba(16,185,129,0.15); }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }

    /* Checkbox group */
    .checkbox-group { max-height: 160px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px; margin-top: 4px; }
    .checkbox-group label { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 4px; cursor: pointer; margin: 0; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; }
    .checkbox-group label:hover { background: #f3f4f6; }
    .checkbox-group input[type="checkbox"] { width: 14px; height: 14px; accent-color: #10b981; }

    /* Buttons */
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; margin-top: 16px; }
    .btn-primary { background: #10b981; color: #fff; }
    .btn-primary:hover { background: #059669; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; margin-top: 8px; }
    .btn-secondary:hover { background: #e5e7eb; }

    /* Refresh schedule */
    .refresh-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .refresh-row select { width: auto; flex: 1; }

    .divider { height: 1px; background: #e5e7eb; margin: 16px 0; }

    .footer { text-align: center; color: #9ca3af; font-size: 10px; margin-top: 20px; }
    .footer a { color: #6b7280; }
  </style>
</head>
<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <p style="margin-top:12px">Connecting to Monstera Cloud…</p>
</div>

<div id="app" style="display:none">
  <!-- User info -->
  <div id="userPill" class="user-pill" style="display:none"></div>

  <!-- Upgrade notice (hidden for paid users) -->
  <div id="upgradeBox" class="upgrade-box" style="display:none">
    <div style="font-size:20px;margin-bottom:4px">🔒</div>
    <div style="font-weight:600;font-size:14px">Upgrade to unlock</div>
    <div style="color:#92400e;font-size:12px;margin-top:4px">
      Google Sheets™ integration requires a Starter or Professional plan.
    </div>
    <a id="upgradeLink" href="#" target="_blank">View Plans</a>
  </div>

  <!-- Query form (hidden for free users) -->
  <div id="queryForm" style="display:none">
    <h2>📊 Data Connector</h2>
    <p class="subtitle">Pull live data directly into this sheet</p>

    <div id="errorBox" class="error-box" style="display:none"></div>
    <div id="successBox" class="success-box" style="display:none"></div>

    <label>Data Source</label>
    <select id="source" disabled>
      <option value="tiktok_ads">TikTok Ads</option>
    </select>

    <label>Connection</label>
    <select id="connection"><option value="">Loading…</option></select>

    <label>Advertiser ID</label>
    <input type="text" id="advertiserId" placeholder="Auto-filled on select" />

    <label>Data Level</label>
    <select id="dataLevel">
      <option value="AUCTION_ADVERTISER">Account</option>
      <option value="AUCTION_CAMPAIGN" selected>Campaign</option>
      <option value="AUCTION_ADGROUP">Ad Group</option>
      <option value="AUCTION_AD">Ad</option>
    </select>

    <div class="row">
      <div><label>Start Date</label><input type="date" id="startDate" /></div>
      <div><label>End Date</label><input type="date" id="endDate" /></div>
    </div>

    <label>Dimensions</label>
    <div id="dimensionsList" class="checkbox-group"></div>

    <label>Metrics</label>
    <div id="metricsList" class="checkbox-group"></div>

    <label>Write to cell</label>
    <input type="text" id="targetCell" value="A1" style="width:80px" />

    <button class="btn btn-primary" id="runBtn" onclick="handleRun()">
      ▶ Get Data
    </button>

    <div class="divider"></div>

    <label>Auto-refresh</label>
    <div class="refresh-row">
      <select id="refreshInterval">
        <option value="0">Manual only</option>
        <option value="1">Every hour</option>
        <option value="3">Every 3 hours</option>
        <option value="6">Every 6 hours</option>
        <option value="12">Every 12 hours</option>
        <option value="24">Daily</option>
      </select>
      <button class="btn-secondary" style="width:auto;margin:0;padding:6px 12px;font-size:11px" onclick="handleSetRefresh()">Set</button>
    </div>
  </div>

  <div class="footer">
    <p>Monstera Cloud · <a href="https://monstera-cloud.vercel.app" target="_blank">monstera-cloud.com</a></p>
  </div>
</div>

<script>
  var schema = null;
  var connections = [];
  var userInfo = null;

  // ── Init ──────────────────────────────────────────────────────────────
  (function init() {
    // Set default dates
    var today = new Date().toISOString().slice(0, 10);
    var weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
    document.getElementById('startDate').value = weekAgo;
    document.getElementById('endDate').value = today;

    // Authenticate
    google.script.run
      .withSuccessHandler(onAuth)
      .withFailureHandler(onError)
      .authenticateUser();
  })();

  function onAuth(data) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    if (data.error === 'no_account' || data.error === 'invalid_token') {
      showError(data.message || 'Please sign up at monstera-cloud.com');
      return;
    }

    userInfo = data.user || data;

    // Show user pill
    if (userInfo && userInfo.email) {
      var pill = document.getElementById('userPill');
      pill.style.display = 'flex';
      pill.innerHTML =
        (userInfo.image ? '<img src="' + userInfo.image + '" />' : '') +
        '<div><div class="name">' + (userInfo.name || userInfo.email) + '</div>' +
        '<span class="plan plan-' + (userInfo.plan || 'free') + '">' + (userInfo.plan || 'free') + '</span></div>';
    }

    if (!data.features || !data.features.canQuery) {
      document.getElementById('upgradeBox').style.display = 'block';
      document.getElementById('upgradeLink').href = data.upgradeUrl || 'https://monstera-cloud.vercel.app/pricing';
      return;
    }

    // Paid user — show query form
    document.getElementById('queryForm').style.display = 'block';

    // Load schema + connections in parallel
    google.script.run.withSuccessHandler(onSchema).getSchema();
    google.script.run.withSuccessHandler(onConnections).getConnections();
  }

  function onSchema(data) {
    schema = data;
    if (schema && schema.sources && schema.sources[0]) {
      renderDimensions();
      renderMetrics();
    }
  }

  function onConnections(data) {
    connections = data.connections || [];
    var sel = document.getElementById('connection');
    var container = document.getElementById('queryForm');
    
    // Check if we have no connections
    if (connections.length === 0) {
      sel.innerHTML = '<option value="">No connections found</option>';
      // Show empty state notice
      var emptyNotice = document.createElement('div');
      emptyNotice.id = 'emptyConnections';
      emptyNotice.className = 'upgrade-box';
      emptyNotice.style.marginTop = '16px';
      emptyNotice.style.display = 'block';
      emptyNotice.innerHTML = 
        '<div style="font-size:20px;margin-bottom:4px">🔌</div>' +
        '<div style="font-weight:600;font-size:14px">No connections</div>' +
        '<div style="color:#6b7280;font-size:12px;margin-top:4px">Create your first data connection in the console.</div>' +
        '<a href="https://monstera-cloud.vercel.app/console" target="_blank">Go to Console</a>';
      
      // Inject before the refresh divider or at the end of the form
      container.insertBefore(emptyNotice, document.querySelector('.divider'));
      return;
    }

    sel.innerHTML = '<option value="">Select connection…</option>';
    connections.forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = (c.sandbox ? '🧪 ' : '') + c.name;
      opt.dataset.advertiserId = (c.advertiserIds && c.advertiserIds[0]) || '';
      sel.appendChild(opt);
    });
    sel.onchange = function() {
      var opt = sel.options[sel.selectedIndex];
      if (opt && opt.dataset.advertiserId) {
        document.getElementById('advertiserId').value = opt.dataset.advertiserId;
      }
    };
  }

  // ── Render dims/metrics based on data level ───────────────────────────
  function renderDimensions() {
    var src = schema.sources[0];
    var level = document.getElementById('dataLevel').value;
    var container = document.getElementById('dimensionsList');
    container.innerHTML = '';
    src.dimensions.forEach(function(d) {
      var enabled = d.levels.indexOf(level) !== -1;
      var lbl = document.createElement('label');
      lbl.style.opacity = enabled ? '1' : '0.35';
      lbl.innerHTML =
        '<input type="checkbox" name="dim" value="' + d.value + '" ' +
        (enabled && (d.value === 'stat_time_day' || d.value === 'campaign_id') ? 'checked' : '') +
        (enabled ? '' : ' disabled') + ' />' + d.label +
        (enabled ? '' : '<span style="margin-left:auto;font-size:10px;color:#9ca3af">↑ change level</span>');
      container.appendChild(lbl);
    });
  }

  function renderMetrics() {
    var src = schema.sources[0];
    var container = document.getElementById('metricsList');
    container.innerHTML = '';
    var defaults = ['spend', 'impressions', 'clicks', 'ctr', 'conversion'];
    src.metrics.forEach(function(m) {
      var lbl = document.createElement('label');
      lbl.innerHTML =
        '<input type="checkbox" name="metric" value="' + m.value + '" ' +
        (defaults.indexOf(m.value) !== -1 ? 'checked' : '') + ' />' + m.label;
      container.appendChild(lbl);
    });
  }

  document.getElementById('dataLevel').addEventListener('change', renderDimensions);

  // ── Run query ─────────────────────────────────────────────────────────
  function handleRun() {
    hideMessages();
    var dims = getChecked('dim');
    var metrics = getChecked('metric');

    if (!document.getElementById('connection').value) { showError('Select a connection.'); return; }
    if (!document.getElementById('advertiserId').value) { showError('Enter advertiser ID.'); return; }
    if (dims.length === 0) { showError('Select at least one dimension.'); return; }
    if (metrics.length === 0) { showError('Select at least one metric.'); return; }

    var btn = document.getElementById('runBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px"></div> Fetching…';

    var params = {
      source: 'tiktok_ads',
      connectionId: document.getElementById('connection').value,
      advertiser_id: document.getElementById('advertiserId').value,
      data_level: document.getElementById('dataLevel').value,
      dimensions: dims,
      metrics: metrics,
      start_date: document.getElementById('startDate').value,
      end_date: document.getElementById('endDate').value,
      targetCell: document.getElementById('targetCell').value || 'A1'
    };

    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.innerHTML = '▶ Get Data';
        if (result.error) {
          showError(result.message || result.error);
        } else {
          showSuccess(result.rowCount + ' rows written to sheet.' +
            (result.truncated ? ' (Truncated from ' + result.totalRows + ' rows)' : ''));
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = '▶ Get Data';
        showError(err.message || 'Something went wrong');
      })
      .runQuery(params);
  }

  // ── Refresh trigger ───────────────────────────────────────────────────
  function handleSetRefresh() {
    var hours = parseInt(document.getElementById('refreshInterval').value, 10);
    google.script.run
      .withSuccessHandler(function() {
        showSuccess(hours > 0 ? 'Auto-refresh set to every ' + hours + 'h' : 'Auto-refresh disabled');
      })
      .setupRefreshTrigger(hours);
  }

  // ── Helpers ───────────────────────────────────────────────────────────
  function getChecked(name) {
    return Array.from(document.querySelectorAll('input[name="' + name + '"]:checked')).map(function(el) { return el.value; });
  }
  function showError(msg) { var b = document.getElementById('errorBox'); b.textContent = msg; b.style.display = 'block'; }
  function showSuccess(msg) { var b = document.getElementById('successBox'); b.textContent = msg; b.style.display = 'block'; }
  function hideMessages() { document.getElementById('errorBox').style.display = 'none'; document.getElementById('successBox').style.display = 'none'; }
  function onError(err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    showError(err.message || 'Failed to connect');
  }
</script>

</body>
</html>
